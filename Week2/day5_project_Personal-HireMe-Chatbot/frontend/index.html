<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask about my experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
  <header>
    <div>
      <h1 id="title">Ask about my experience</h1>
      <p>Answers come straight from my resume. Ask about roles, skills, projects, or education.</p>
    </div>

    <div class="contact">
      <span class="label">Prefer to talk directly?</span>
      <a id="phone" href="#"></a>
      <a id="email" href="#"></a>
    </div>
  </header>

  <main id="thread" aria-live="polite"></main>

  <div class="chips" id="chips"></div>

  <form id="form" autocomplete="off">
    <input id="q" type="text" placeholder="Ask a question about my background" aria-label="Your question" required>
    <button class="send" id="send" type="submit">Send</button>
    <button class="send stop" id="stop" type="button" hidden>Stop</button>
  </form>
</div>

<script src="script.js"></script>

</body>
</html>
